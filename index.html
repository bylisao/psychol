<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ефективне спілкування без конфліктів: практичні завдання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F9; --lav:#DBDEED; --lav2:#B8BED7; --blue:#3252A8; --deep:#203B83; --navy:#0F2358;
  --amber:#E4AB4C; --rasp:#B32856; --teal:#76AFB6; --slate:#617EA3; --ink:#0F2358; --muted:#4A4F63;
  --white:#FFFFFF; --line:#DBDEED;
  --font:"Pangolin","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--font)}
.page{max-width:900px;margin:0 auto;padding:18px 14px 0}
.hero{background:var(--lav2);border-radius:26px;padding:22px 24px;margin-bottom:14px}
.kicker{display:inline-block;background:var(--deep);color:#fff;border-radius:999px;padding:4px 14px;font-size:.85rem;margin-bottom:10px}
h1{font-size:2rem;line-height:1.1;margin:0 0 6px;color:#000}
.sub{margin:0;color:var(--navy);font-size:.95rem}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.steps button{appearance:none;border:0;background:var(--lav);color:var(--navy);font:inherit;font-size:.92rem;padding:8px 14px;border-radius:999px;cursor:pointer}
.steps button[aria-selected="true"]{background:var(--deep);color:#fff}
.steps button.done::after{content:" ✓";color:var(--amber)}
.steps button[aria-selected="true"].done::after{color:var(--amber)}
.card{background:var(--white);border-radius:24px;padding:22px 24px;margin:0 0 14px}
.card h2{font-size:1.5rem;margin:0 0 6px;color:#000}
.pill{display:inline-block;background:var(--lav);color:var(--navy);border-radius:999px;padding:3px 14px;font-size:.85rem;margin-bottom:8px}
.lead{margin:0 0 14px;color:var(--muted)}
.dark{background:var(--deep);color:#fff;border-radius:20px;padding:14px 18px;margin:14px 0}
.dark b,.dark .amber{color:var(--amber)}
.soft{background:var(--lav);border-radius:20px;padding:14px 18px;margin:14px 0}
.btn{appearance:none;border:0;font:inherit;font-size:1rem;padding:11px 22px;border-radius:999px;cursor:pointer;background:var(--deep);color:#fff}
.btn:hover{background:var(--blue)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--lav);color:var(--navy)}
.btn.ghost:hover{background:var(--lav2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
button:focus-visible,input:focus-visible+label,textarea:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* likert */
.q{border:0;margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.q legend{padding:0;margin-bottom:8px;max-width:60ch}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale label{width:46px;text-align:center;padding:8px 0;border-radius:999px;background:var(--lav);cursor:pointer}
.scale input:checked+label{background:var(--deep);color:#fff}
.axis{display:flex;justify-content:space-between;max-width:260px;font-size:.78rem;color:var(--muted);margin-top:2px}
.progress{font-size:.9rem;color:var(--muted);margin:10px 0 0}
/* result cards */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.tile{border-radius:18px;padding:14px 16px;color:#fff}
.tile .n{font-size:2rem;line-height:1}
.tile small{display:block;opacity:.9;margin-top:4px}
.t-a{background:var(--blue)} .t-b{background:var(--rasp)} .t-c{background:var(--slate)} .t-d{background:var(--teal);color:#0F2358}
.tile.top{box-shadow:0 0 0 4px var(--amber)}
/* chat bubbles */
.chat{display:grid;gap:10px}
.msg{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bubble{background:var(--bg);border-radius:16px;padding:10px 14px;border:1px solid var(--line);font-size:1.15rem;width:fit-content;max-width:100%}
/* channel table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.dot button{appearance:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--blue);background:#fff;cursor:pointer;position:relative}
td.dot button[aria-pressed="true"]{background:var(--blue)}
td.dot.rec button{box-shadow:0 0 0 3px var(--amber)}
td.dot button.recdot::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;color:var(--amber)}
.legend{font-size:.85rem;color:var(--muted);margin-top:8px}
/* builder */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{appearance:none;border:2px solid var(--lav);background:#fff;color:var(--navy);font:inherit;font-size:.95rem;padding:10px 14px;border-radius:14px;cursor:pointer;text-align:left;max-width:100%}
.tabs button[aria-pressed="true"]{border-color:var(--deep);background:var(--lav)}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-size:.9rem;color:var(--muted)}
textarea,input[type=text]{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:14px;border:2px solid var(--lav);background:#fff;color:var(--ink);resize:vertical}
.preview{background:var(--deep);color:#fff;border-radius:20px;padding:14px 18px;margin:12px 0;font-size:1.05rem;min-height:64px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{appearance:none;border:0;background:var(--lav);color:var(--navy);font:inherit;font-size:.88rem;padding:6px 12px;border-radius:999px;cursor:pointer}
.warnbox{border-left:5px solid var(--amber);background:#FFF7E6;padding:10px 14px;border-radius:12px;font-size:.95rem;margin:8px 0}
pre{white-space:pre-wrap;background:var(--bg);border-radius:16px;padding:14px;font:inherit;font-size:.98rem;margin:8px 0}
.foot{background:var(--slate);color:#fff;border-radius:18px 18px 0 0;padding:12px 18px;margin-top:20px;font-size:.88rem}

#certWrap{margin:12px 0}
#cert{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
ul{margin:6px 0 0;padding-left:22px}
@media print{
  body *{visibility:hidden}
  #certWrap,#certWrap *{visibility:visible}
  #certWrap{position:absolute;left:0;top:0;width:100%;margin:0}
  #cert{border:0;border-radius:0}
  @page{size:A4 landscape;margin:8mm}
}
[hidden]{display:none!important}
@media (max-width:560px){h1{font-size:1.55rem}.hero,.card{padding:16px}.msg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <span class="kicker">Тема місяця: комунікація та міжособистісні стосунки</span>
    <h1>Ефективне спілкування без конфліктів</h1>
    <p class="sub">Практичні завдання · Лабораторія ментального здоров’я, менторства та медіаторства · ХНЕУ імені Семена Кузнеця</p>
  </header>
  <nav class="steps" id="steps" aria-label="Завдання"></nav>
  <main id="panels"></main>
  <div class="foot">Результати нікуди не надсилаються й не зберігаються. Це навчальні вправи, а не діагностика.</div>
</div>

<script>
(function(){
  var S = {test:null, chan:null, rewrite:null, rules:null};
  var STEPS = [["test","Слайд 3 · Міні-тест"],["chan","Слайд 5 · Текст чи голос"],["rew","Слайд 7 · Перепиши"],["rules","Слайд 9 · Правила чату"],["sum","Слайд 10 · Мій листок"]];
  var stepsEl=document.getElementById("steps"), panelsEl=document.getElementById("panels"), btns={}, panels={};
  function show(id){
    Object.keys(panels).forEach(function(k){ panels[k].hidden = k!==id; btns[k].setAttribute("aria-selected", k===id); });
    if(id==="sum") renderSum();
    window.scrollTo({top:0});
  }
  function mark(id){ btns[id].classList.add("done"); }
  function next(id){ var i=STEPS.map(function(s){return s[0];}).indexOf(id); return STEPS[i+1] && STEPS[i+1][0]; }
  function nextBtn(id,container){
    var nx=next(id); if(!nx) return;
    var r=document.createElement("div"); r.className="row";
    var b=document.createElement("button"); b.className="btn"; b.textContent=nx==="sum"?"До підсумку":"Далі"; b.addEventListener("click", function(){ show(nx); });
    r.appendChild(b); container.appendChild(r);
  }
  STEPS.forEach(function(s){
    var b=document.createElement("button"); b.textContent=s[1]; b.setAttribute("aria-selected","false"); b.addEventListener("click", function(){ show(s[0]); });
    stepsEl.appendChild(b); btns[s[0]]=b;
    var p=document.createElement("section"); p.hidden=true; panelsEl.appendChild(p); panels[s[0]]=p;
  });
  function h(html){ var d=document.createElement("div"); d.innerHTML=html; return d; }
  function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

  /* ---------- 2. Тест ---------- */
  var TEST=[["A","Коли мене щось зачіпає, я кажу «усе нормально», навіть якщо це не так."],["A","Я проковтую образу, щоб не псувати стосунки."],["A","Мені важко сказати людині, що мені не подобається її поведінка."],
            ["B","У суперечці я підвищую голос або говорю різко."],["B","Я схильний нагадувати людині про її минулі помилки."],["B","Я наполягаю, доки не отримаю відповідь."],
            ["C","Коли напруга зростає, я замовкаю або виходжу з розмови."],["C","Я уникаю складних розмов і сподіваюся, що саме минеться."],["C","Коли дратуюсь, я відповідаю односкладово («ок», «добре»)."],
            ["D","Я намагаюся спершу зрозуміти, що важливо для іншої людини."],["D","Я можу сказати, що мене зачепило, без образ."],["D","Я пропоную варіанти, які підходять обом."]];
  var TNAMES={A:"Стримую",B:"Тисну",C:"Віддаляюсь",D:"Шукаю рішення"};
  var TTEXT={
    A:"Ви уникаєте відкритого вираження емоцій заради миру. Ризик: людина навпроти не знає про вашу образу, дистанція росте. Спробуйте: назвати емоцію й сказати про потребу за формулою.",
    B:"Ви наполягаєте й говорите різко, коли напружені. Ризик: співрозмовник захищається або віддаляється. Спробуйте: паузу, а потім формулу «Коли… я… бо…».",
    C:"Ви замовкаєте або виходите з розмови. Ризик: інший відчуває, що його ігнорують, і тисне сильніше. Спробуйте: домовитися про перерву з часом повернення.",
    D:"Ви намагаєтеся зрозуміти й домовитися. Це ваш ресурс: розвивайте його, але придивіться до ситуацій, де вас вибиває."};
  (function(){
    var p=panels.test;
    p.innerHTML="<div class=\"card\"><span class=\"pill\">Слайд 3</span><h2>Міні-тест «Моя реакція під напругою»</h2><p class=\"lead\">12 тверджень, приблизно 3 хвилини. Оцініть, наскільки кожне про вас, коли напруга зростає. Результат бачите лише ви. Це не діагностика, а привід подумати.</p><form id=\"tf\" onsubmit=\"return false\"></form><p class=\"progress\" id=\"tp\" aria-live=\"polite\"></p><div class=\"row\"><button class=\"btn\" id=\"tb\" disabled>Показати результат</button></div><div id=\"tr\" aria-live=\"polite\"></div></div>";
    var f=p.querySelector("#tf"), prog=p.querySelector("#tp"), b=p.querySelector("#tb"), r=p.querySelector("#tr"), ans={};
    TEST.forEach(function(t,i){
      var fs=document.createElement("fieldset"); fs.className="q";
      fs.innerHTML="<legend>"+(i+1)+". "+t[1]+"</legend>";
      var sc=document.createElement("div"); sc.className="scale";
      for(var v=1;v<=5;v++){ (function(v){
        var id="t"+i+"_"+v, inp=document.createElement("input"); inp.type="radio"; inp.name="t"+i; inp.id=id;
        inp.addEventListener("change", function(){ ans[i]=v; upd(); });
        var lb=document.createElement("label"); lb.htmlFor=id; lb.textContent=v; sc.appendChild(inp); sc.appendChild(lb); })(v); }
      fs.appendChild(sc); fs.insertAdjacentHTML("beforeend","<div class=\"axis\"><span>зовсім ні</span><span>цілком так</span></div>");
      f.appendChild(fs);
    });
    function upd(){ var n=Object.keys(ans).length; prog.textContent="Відповіли: "+n+" з "+TEST.length; b.disabled=n<TEST.length; }
    upd();
    b.addEventListener("click", function(){
      var s={A:0,B:0,C:0,D:0}; TEST.forEach(function(t,i){ s[t[0]]+=ans[i]; });
      var mx=Math.max(s.A,s.B,s.C,s.D), top=["A","B","C","D"].filter(function(k){return s[k]===mx;});
      var cls={A:"t-a",B:"t-b",C:"t-c",D:"t-d"};
      var html="<div class=\"grid4\">"+["A","B","C","D"].map(function(k){return "<div class=\"tile "+cls[k]+(top.indexOf(k)>-1?" top":"")+"\"><div class=\"n\">"+s[k]+"</div><b>"+TNAMES[k]+"</b><small>від 3 до 15</small></div>";}).join("")+"</div>";
      html+="<div class=\"soft\"><b>Найвищий бал: "+top.map(function(k){return TNAMES[k];}).join(", ")+".</b><br>"+top.map(function(k){return TTEXT[k];}).join("<br>")+"</div>";
      html+="<div class=\"dark\">Високі <b>Б</b> у вас і <b>В</b> у близьких = те саме коло «вимога - відсторонення». Ніхто не є «одним типом»: реакції залежать від ситуації й людини.</div>";
      r.innerHTML=html; S.test={s:s,top:top.map(function(k){return TNAMES[k];})}; mark("test"); nextBtn("test",r);
      r.scrollIntoView({behavior:"smooth",block:"start"});
    });
  })();

  /* ---------- 4. Канал ---------- */
  var CH=[["Подякувати за допомогу","ТГ"],["Домовитися про час зустрічі","Т"],["Вибачитися за помилку","ГДЖ"],["Повідомити неприємну новину","ДЖ"],["Не погодитися з думкою колеги","ГД"],["Уточнити дедлайн","Т"],["Підтримати друга, якому важко","ГДЖ"],["Поскаржитися на поведінку людини","ДЖ"]];
  var CHL=["Т","Г","Д","Ж"];
  (function(){
    var p=panels.chan;
    p.innerHTML="<div class=\"card\"><span class=\"pill\">Слайд 5</span><h2>Текст чи голос: який канал вибрати</h2><p class=\"lead\">Для кожної ситуації позначте канал, у якому вам зручніше (можна кілька). Т - текст, Г - голосове, Д - дзвінок, Ж - наживо. Потім поділіться з сусідом: який канал зручніший вам і чому, і де ваш вибір розходиться.</p><div class=\"tablewrap\"><table><thead><tr><th>Ситуація</th><th>Т</th><th>Г</th><th>Д</th><th>Ж</th></tr></thead><tbody id=\"cb\"></tbody></table></div><p class=\"legend\" id=\"cl\">★ з’являться після натискання «Показати рекомендації».</p><div class=\"row\"><button class=\"btn\" id=\"cs\">Показати рекомендації</button></div><div id=\"cr\"></div></div>";
    var tb=p.querySelector("#cb"), pick=CH.map(function(){return {Т:false,Г:false,Д:false,Ж:false};});
    CH.forEach(function(c,i){
      var tr=document.createElement("tr"); tr.innerHTML="<td>"+c[0]+"</td>";
      CHL.forEach(function(l){
        var td=document.createElement("td"); td.className="dot"; var bt=document.createElement("button"); bt.setAttribute("aria-pressed","false"); bt.setAttribute("aria-label",c[0]+": "+l);
        bt.addEventListener("click", function(){ pick[i][l]=!pick[i][l]; bt.setAttribute("aria-pressed", pick[i][l]); });
        td.appendChild(bt); td.dataset.l=l; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    p.querySelector("#cs").addEventListener("click", function(){
      var hits=0, total=0;
      CH.forEach(function(c,i){
        var tds=tb.rows[i].querySelectorAll("td.dot");
        tds.forEach(function(td){
          var l=td.dataset.l, rec=c[1].indexOf(l)>-1, btn=td.firstChild;
          td.classList.toggle("rec",rec); btn.classList.toggle("recdot",rec);
          if(pick[i][l]){ total++; if(rec) hits++; }
        });
      });
      var r=p.querySelector("#cr");
      p.querySelector("#cl").textContent="★ - рекомендований канал (практична рекомендація, з досвіду ведення розмов).";
      r.innerHTML="<div class=\"soft\"><b>Ваш вибір збігся з рекомендацією у "+hits+" з "+total+" відміток.</b> Порівняйте з сусідом: де ваш вибір розходиться і чому?</div><div class=\"soft\"><b>Домовтеся.</b> Запитайте сусіда, який канал зручніший йому, і домовтеся, як писатимете одне одному, коли виникне розбіжність.</div><div class=\"dark\"><b>Текст:</b> факти й домовленості - час, місце, термін. <b>Голос або дзвінок:</b> розбіжності, вибачення, образи. <b>Наживо:</b> найскладніше.</div><div class=\"soft\">Дослідження 2017 року: хто чує чужу думку (особливо ту, з якою не згоден), вважає автора виваженішим і «людянішим», ніж той, хто читає той самий текст.<br><b>Вже 2-3 повідомлення без згоди й напруга росте? «Давай я зателефоную».</b></div>";
      S.chan={hits:hits,total:total}; mark("chan"); nextBtn("chan",r);
    });
  })();

  /* ---------- 5. Перепиши ---------- */
  var CARDS=[
    {t:"«Ти знову нічого не зробив. Як завжди.»",c:"груповий проєкт",ex:{w:"у спільному документі я не бачу твоєї частини",f:"хвилююся, що ми не встигнемо",n:"здати вчасно",r:"додати її до четверга"}},
    {t:"«Ти можеш хоч раз помити за собою посуд?!»",c:"гуртожиток",ex:{w:"посуд лишається в мийці до ранку",f:"мені незатишно на кухні",n:"щоб було чисто",r:"мити посуд у день використання"}},
    {t:"«Ну звісно, ти ж «дуже зайнятий» 🙂»",c:"друг",ex:{w:"ти скасовуєш зустріч в останню хвилину",f:"мені прикро",n:"я розраховував на цей вечір",r:"попереджати за добу"}},
    {t:"«Це нечесно! Ви мене не слухаєте!»",c:"команда",ex:{w:"моя пропозиція лишилася без відповіді",f:"мене це засмучує",n:"бути почутим",r:"коротко повторити пропозицію й обговорити її"}}
  ];
  (function(){
    var p=panels.rew;
    p.innerHTML="<div class=\"card\"><span class=\"pill\">Слайд 7</span><h2>Перепиши: формула й мова відкритості</h2><div class=\"dark\">Коли <b>[факт без оцінки]</b>, я <b>[почуття]</b>, бо мені важливо <b>[потреба]</b>. Чи могли б ми <b>[конкретне прохання]</b>?</div><p class=\"lead\">Оберіть картку з різким повідомленням і перепишіть його за формулою.</p><div class=\"tabs\" id=\"rc\"></div><div id=\"rb\"></div></div>";
    var tabs=p.querySelector("#rc"), body=p.querySelector("#rb"), cur=0;
    CARDS.forEach(function(c,i){ var b=document.createElement("button"); b.setAttribute("aria-pressed", i===0); b.innerHTML=c.t+"<br><small>"+c.c+"</small>"; b.addEventListener("click", function(){ cur=i; tabs.querySelectorAll("button").forEach(function(x,j){x.setAttribute("aria-pressed", j===i);}); draw(); }); tabs.appendChild(b); });
    function draw(){
      var c=CARDS[cur];
      body.innerHTML="<div class=\"field\"><label for=\"fw\">Коли… (факт без оцінки)</label><input type=\"text\" id=\"fw\" placeholder=\"що саме сталося, без «завжди» й «ніколи»\"></div>"+
        "<div class=\"field\"><label for=\"ff\">я… (почуття)</label><input type=\"text\" id=\"ff\" placeholder=\"наприклад: хвилююся, мені прикро\"></div>"+
        "<div class=\"field\"><label for=\"fn\">бо мені важливо… (потреба)</label><input type=\"text\" id=\"fn\" placeholder=\"що для вас тут важливо\"></div>"+
        "<div class=\"field\"><label for=\"fr\">Чи могли б ми… (конкретне прохання)</label><input type=\"text\" id=\"fr\" placeholder=\"на що можна відповісти «так» чи «ні»\"></div>"+
        "<p class=\"legend\">Мова відкритості (необов’язково):</p><div class=\"chips\" id=\"ch\"><button data-add=\"Я розумію, що для тебе це важливо. \">визнати погляд іншого</button><button data-add=\"Мені здається, \">пом’якшити: «мені здається»</button><button data-add=\"Ми обоє хочемо, щоб все вийшло. \">підкреслити спільне</button></div>"+
        "<div class=\"field\"><label for=\"fo\">Фраза на початку (з мови відкритості)</label><input type=\"text\" id=\"fo\"></div>"+
        "<div class=\"preview\" id=\"pv\" aria-live=\"polite\">Ваше повідомлення з’явиться тут.</div><div id=\"wn\"></div>"+
        "<div class=\"row\"><button class=\"btn ghost\" id=\"ex\">Показати приклад</button><button class=\"btn\" id=\"sv\">Зберегти у листок</button></div><div id=\"ms\" class=\"legend\"></div>";
      var el=function(id){return body.querySelector("#"+id);};
      function lc(s){ return s ? s.charAt(0).toLowerCase()+s.slice(1) : s; }
      function build(){
        var w=el("fw").value.trim(), f=el("ff").value.trim(), n=el("fn").value.trim(), r=el("fr").value.trim(), o=el("fo").value.trim();
        var msg="";
        if(w||f||n||r){
          msg=(o?o.replace(/\s*$/," "):"")+"Коли "+(w||"…")+", я "+(f||"…")+", бо мені важливо "+(n||"…")+". Чи могли б ми "+(r||"…")+"?";
        }
        el("pv").textContent = msg || "Ваше повідомлення з’явиться тут.";
        var warns=[], all=(w+" "+f+" "+n+" "+r).toLowerCase();
        if(/завжди|ніколи|знову|вічно|постійно/.test(all)) warns.push("У тексті є узагальнення («завжди», «ніколи», «знову»): вони звучать як оцінка характеру. Замініть їх на конкретний факт.");
        if(/ти (не|ж|такий|погани|ледач)/.test(all)) warns.push("Схоже, є оцінка особи («ти такий…», «ти не…»). Опишіть те, що сталося, а не людину.");
        if(r && !/[а-яіїєґ]{3,}/i.test(r)) warns.push("Прохання має бути конкретним.");
        el("wn").innerHTML = warns.map(function(x){return "<div class=\"warnbox\">"+x+"</div>";}).join("");
        S.rewrite={card:c.t,msg:msg};
      }
      body.querySelectorAll("input[type=text]").forEach(function(i){ i.addEventListener("input", build); });
      el("ch").addEventListener("click", function(e){ var a=e.target.getAttribute && e.target.getAttribute("data-add"); if(!a) return; el("fo").value=(el("fo").value+a).trim()+" "; build(); });
      el("ex").addEventListener("click", function(){ el("fw").value=c.ex.w; el("ff").value=c.ex.f; el("fn").value=c.ex.n; el("fr").value=c.ex.r; build(); el("ms").textContent="Це приклад. Прочитайте його вголос і порівняйте з тим, як звучить оригінал."; });
      el("sv").addEventListener("click", function(){ build(); if(S.rewrite.msg){ mark("rew"); el("ms").textContent="Збережено в «Мій листок». Тепер скажіть те саме вголос співрозмовнику й подивіться, чи відчувається різниця між текстом і голосом."; } else el("ms").textContent="Спершу заповніть поля."; });
    }
    draw();
    nextBtn("rew", p.querySelector(".card"));
  })();

  /* ---------- 6. Правила чату ---------- */
  var RULES=[["Темп відповіді","Ми відповідаємо протягом … Якщо не встигаємо, пишемо …"],["Терміновість","Терміново позначаємо … , усе інше чекає до …"],["Канал","Якщо напруга росте після … повідомлень, переходимо на …"],["Тон і жарти","Жарти позначаємо … ; сарказму в чаті …"],["Пауза","Якщо розмова стає гарячою, кажемо … і повертаємося через …"]];
  (function(){
    var p=panels.rules;
    p.innerHTML="<div class=\"card\"><span class=\"pill\">Слайд 9</span><h2>Правила нашого чату</h2><p class=\"lead\">Працюйте в групі по 4-5 осіб: допишіть п’ять правил для чату вашої групи чи проєкту. Одна людина вводить, решта підказує.</p><div id=\"rr\"></div><div class=\"row\"><button class=\"btn\" id=\"rs\">Зберегти у листок</button><button class=\"btn ghost\" id=\"rc2\">Скопіювати правила</button></div><p class=\"legend\" id=\"rm\" aria-live=\"polite\"></p></div>";
    var rr=p.querySelector("#rr");
    RULES.forEach(function(r,i){ rr.insertAdjacentHTML("beforeend","<div class=\"field\"><label for=\"ru"+i+"\">"+(i+1)+". "+r[0]+"</label><textarea id=\"ru"+i+"\" rows=\"2\" placeholder=\""+esc(r[1])+"\"></textarea></div>"); });
    function collect(){ return RULES.map(function(r,i){ var v=p.querySelector("#ru"+i).value.trim(); return v?(i+1)+". "+r[0]+": "+v:""; }).filter(Boolean); }
    p.querySelector("#rs").addEventListener("click", function(){ var c=collect(); var m=p.querySelector("#rm"); if(!c.length){ m.textContent="Спершу допишіть хоча б одне правило."; return; } S.rules=c; mark("rules"); m.textContent="Збережено в «Мій листок»."; });
    p.querySelector("#rc2").addEventListener("click", function(){ var c=collect(); var m=p.querySelector("#rm"); if(!c.length){ m.textContent="Спершу допишіть хоча б одне правило."; return; } var t=c.join("\n"); try{ navigator.clipboard.writeText(t).then(function(){m.textContent="Скопійовано. Можна вставити в чат групи.";},function(){m.textContent="Виділіть і скопіюйте текст вручну.";}); }catch(e){ m.textContent="Виділіть і скопіюйте текст вручну."; } });
    nextBtn("rules", p.querySelector(".card"));
  })();

  /* ---------- Підсумок ---------- */
  function renderSum(){
    var p=panels.sum;
    var need=[["test","Слайд 3. Міні-тест"],["chan","Слайд 5. Текст чи голос"],["rew","Слайд 7. Перепиши"],["rules","Слайд 9. Правила чату"]];
    var left=need.filter(function(n){ return !btns[n[0]].classList.contains("done"); });
    var L=[];
    if(S.test) L.push("Слайд 3. Моя реакція під напругою: "+["A","B","C","D"].map(function(k){return TNAMES[k]+" "+S.test.s[k];}).join("; ")+". Найвищий: "+S.test.top.join(", ")+".");
    if(S.chan) L.push("Слайд 5. Вибір каналу: збіг із рекомендацією "+S.chan.hits+" з "+S.chan.total+" відміток.");
    if(S.rewrite && S.rewrite.msg) L.push("Слайд 7. Моє переписане повідомлення: "+S.rewrite.msg);
    if(S.rules){ L.push("Слайд 9. Правила нашого чату:"); S.rules.forEach(function(x){ L.push("  "+x); }); }
    var txt="Ефективне спілкування без конфліктів · мій листок\n"+L.join("\n");
    p.innerHTML="<div class=\"card\"><span class=\"pill\">Слайд 10</span><h2>Мій листок</h2></div>";
    var card=p.firstChild;
    if(left.length){
      card.insertAdjacentHTML("beforeend","<p class=\"lead\">Щоб отримати грамоту, пройдіть усі чотири завдання. Ще не завершено:</p><ul>"+left.map(function(n){return "<li>"+n[1]+"</li>";}).join("")+"</ul>");
    } else {
      card.insertAdjacentHTML("beforeend","<p class=\"lead\">Усі завдання виконано. Ось ваша грамота. Можна вписати ім’я й зберегти її як фото або PDF.</p><div class=\"field\"><label for=\"nm\">Ім’я (необов’язково, нікуди не надсилається)</label><input type=\"text\" id=\"nm\" maxlength=\"60\" placeholder=\"Наприклад: Олена\"></div><div id=\"certWrap\"><canvas id=\"cert\" aria-label=\"Грамота\"></canvas></div><div class=\"row\"><button class=\"btn\" id=\"png\">Зберегти як фото</button><button class=\"btn ghost\" id=\"pdf\">Зберегти як PDF</button></div><p class=\"legend\" id=\"sm\" aria-live=\"polite\">PDF: у вікні друку оберіть «Зберегти як PDF».</p>");
      var cv=card.querySelector("#cert"), nm=card.querySelector("#nm");
      var data={top:S.test.top.join(", "),hits:S.chan.hits,total:S.chan.total,rules:S.rules.length};
      var draw=function(){ drawCert(cv,nm.value.trim(),data); };
      nm.addEventListener("input", draw); draw();
      if(document.fonts && document.fonts.load){ document.fonts.load("40px Pangolin").then(draw,function(){}); }
      card.querySelector("#png").addEventListener("click", function(){
        try{ draw(); var a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="грамота.png"; document.body.appendChild(a); a.click(); a.remove(); }
        catch(e){ card.querySelector("#sm").textContent="Не вдалося зберегти фото. Зробіть скриншот екрана."; }
      });
      card.querySelector("#pdf").addEventListener("click", function(){ draw(); window.print(); });
    }
    if(L.length){
      card.insertAdjacentHTML("beforeend","<h3 style=\"margin-top:18px\">Мої відповіді</h3><pre id=\"st\"></pre><div class=\"dark\"><b>Алгоритм «ПАУЗА»:</b> <b>П</b>омітити · <b>А</b>ртикулювати емоцію · <b>У</b>точнити · <b>З</b>азначити своє за формулою · <b>А</b>лгоритм: прохання й перерва з часом повернення</div><div class=\"row\"><button class=\"btn ghost\" id=\"cp\">Скопіювати текст</button></div><p class=\"legend\" id=\"cm\" aria-live=\"polite\"></p>");
      card.querySelector("#st").textContent=txt;
      card.querySelector("#cp").addEventListener("click", function(){ var m=card.querySelector("#cm"); try{ navigator.clipboard.writeText(txt).then(function(){m.textContent="Скопійовано.";},function(){m.textContent="Виділіть текст вище й скопіюйте вручну.";}); }catch(e){ m.textContent="Виділіть текст вище й скопіюйте вручну."; } });
    }
  }

  function plural(n){ var a=n%10,b=n%100; if(a===1&&b!==11) return n+" правило"; if(a>=2&&a<=4&&(b<10||b>=20)) return n+" правила"; return n+" правил"; }
  function wrap(c,text,x,y,maxW,lh){
    var words=text.split(" "), line="", yy=y;
    words.forEach(function(w){ var t=line?line+" "+w:w; if(c.measureText(t).width>maxW && line){ c.fillText(line,x,yy); line=w; yy+=lh; } else line=t; });
    if(line){ c.fillText(line,x,yy); yy+=lh; }
    return yy;
  }
  function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  function drawCert(cv,name,d){
    var W=1600,H=1130; cv.width=W; cv.height=H; var c=cv.getContext("2d");
    var F="Pangolin,'Trebuchet MS','Segoe UI',Arial,sans-serif";
    c.fillStyle="#F1F5F9"; c.fillRect(0,0,W,H);
    c.fillStyle="#B8BED7"; rr(c,36,36,W-72,H-72,46); c.fill();
    c.fillStyle="#FFFFFF"; rr(c,70,70,W-140,H-140,32); c.fill();
    c.fillStyle="#203B83"; rr(c,W/2-420,120,840,54,27); c.fill();
    c.fillStyle="#FFFFFF"; c.font="28px "+F; c.textAlign="center"; c.fillText("Тема місяця: комунікація та міжособистісні стосунки",W/2,157);
    c.fillStyle="#E4AB4C"; [[170,260],[W-170,260]].forEach(function(p){ c.beginPath(); c.arc(p[0],p[1],20,0,7); c.fill(); });
    c.fillStyle="#0F2358"; c.font="bold 116px "+F; c.fillText("ГРАМОТА",W/2,290);
    c.fillStyle="#000000"; c.font="54px "+F; c.fillText("Ефективне спілкування без конфліктів",W/2,372);
    c.fillStyle="#4A4F63"; c.font="30px "+F; c.fillText("вручається",W/2,430);
    c.fillStyle="#203B83"; c.font="bold 68px "+F; var nmText=name||"учаснику заняття"; c.fillText(nmText,W/2,508);
    c.strokeStyle="#E4AB4C"; c.lineWidth=5; c.beginPath(); c.moveTo(W/2-360,532); c.lineTo(W/2+360,532); c.stroke();
    c.fillStyle="#4A4F63"; c.font="30px "+F; c.fillText("за виконання практичних завдань",W/2,590);
    c.textAlign="left"; c.fillStyle="#0F2358"; c.font="32px "+F;
    var items=["Слайд 3. Міні-тест «Моя реакція під напругою»: "+d.top,"Слайд 5. Текст чи голос: збіг із рекомендаціями "+d.hits+" з "+d.total,"Слайд 7. Перепиши: повідомлення за формулою «Коли… я… бо… чи могли б ми…»","Слайд 9. Правила нашого чату: "+plural(d.rules)];
    var y=650; items.forEach(function(t){ c.fillStyle="#E4AB4C"; c.beginPath(); c.arc(214,y-10,8,0,7); c.fill(); c.fillStyle="#0F2358"; y=wrap(c,t,240,y,1150,42)+10; });
    c.textAlign="center"; c.fillStyle="#617EA3"; c.font="28px "+F;
    c.fillText("Лабораторія ментального здоров’я, менторства та медіаторства · ХНЕУ імені Семена Кузнеця",W/2,H-150);
    var dt=new Date(); var ds=("0"+dt.getDate()).slice(-2)+"."+("0"+(dt.getMonth()+1)).slice(-2)+"."+dt.getFullYear();
    c.fillStyle="#4A4F63"; c.font="26px "+F; c.fillText(ds,W/2,H-108);
  }
  show("test");
})();
</script>
</body>
